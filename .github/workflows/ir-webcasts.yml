name: IR webcasts — daily crawl

# Refreshes the company list from SEC, reads new 8-K webcast announcements,
# finds IR sites, crawls them for webcast links (time-boxed, oldest first so the
# whole universe rotates through), rebuilds docs/webcasts and commits the result.

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      crawl_minutes:
        description: "Minutes to spend crawling IR sites"
        default: "200"

permissions:
  contents: write

concurrency:
  group: ir-webcasts
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    defaults:
      run:
        working-directory: ir_webcasts
    env:
      # SEC requires a contact address in the User-Agent. Set it under
      # Settings → Secrets and variables → Actions → Variables.
      IRW_CONTACT: ${{ vars.IRW_CONTACT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Refresh universe
        run: python -m irwebcasts universe

      - name: Collect
        run: |
          python -m irwebcasts daily \
            --crawl-minutes "${{ github.event.inputs.crawl_minutes || '200' }}"

      - name: Test
        run: python -m unittest discover -s tests

      - name: Commit
        working-directory: .
        run: |
          git config user.name "ir-webcasts-bot"
          git config user.email "ir-webcasts-bot@users.noreply.github.com"
          git add ir_webcasts/data docs/webcasts
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "IR webcasts update $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
